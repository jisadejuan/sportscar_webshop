{% extends 'base.html' %}
{% block content %}
<h1>User Login</h1>
<form method="POST" action="{{ url_for('auth.user_login') }}">
  <input type="email" name="email" placeholder="example@gmail.com" required>
  <input type="password" name="password" placeholder="Enter your password" required>
  <button type="submit">Login</button>
</form>
<p>Don't have an account? <a href="{{ url_for('auth.user_signup') }}">Sign Up</a></p>
{% endblock %}
