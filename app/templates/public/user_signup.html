{% extends 'base.html' %}
{% block content %}

<section id="user-signup-section" class="user-signup-container">
  <h1 class="user-signup-title">User Sign Up</h1>

  <form method="POST" action="{{ url_for('auth.user_signup') }}" class="user-signup-form">
    <div class="user-signup-group">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" name="email" placeholder="example@gmail.com" required>
    </div>

    <div class="user-signup-group">
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" name="password" placeholder="Enter your password" required>
    </div>

    <div class="user-signup-actions">
      <button type="submit" class="user-btn-save">Sign Up</button>
      <a href="{{ url_for('auth.user_login') }}" class="user-btn-cancel">Log In</a>
    </div>
  </form>
</section>

{% endblock %}
