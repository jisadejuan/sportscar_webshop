{% extends 'base.html' %}
{% block content %}
<h1>User Sign Up</h1>
<form method="POST" action="{{ url_for('auth.user_signup') }}">
  <input type="email" name="email" placeholder="example@gmail.com" required>
  <input type="password" name="password" placeholder="Enter your password" required>
  <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{{ url_for('auth.user_login') }}">Log In</a></p>
{% endblock %}
