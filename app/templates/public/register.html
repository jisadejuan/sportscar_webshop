{% extends 'base.html'%}
{% block content %}

<!-- Registration Section -->
<section class="register-page">
  <div class="register-box">
    <h1>Create Your Account</h1>
    <p>Sign up with your Gmail address to access SportsCar user pages.</p>

    <form class="register-form" method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="email">Gmail Address</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-register">Sign Up</button>
    </form>

    <div class="register-footer">
      <p>Already have an account? <a href="{{ url_for('auth.user_login') }}">Login here</a></p>
    </div>
  </div>
</section>

{% endblock %}
