{% extends 'base.html' %}
{% block content %}

<section id="user-login-section" class="user-login-container">
  <h1 class="user-login-title">User Login</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="user-login-messages">
        {% for category, message in messages %}
          <p class="user-login-message user-login-{{ category }}"><strong>{{ message }}</strong></p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form id="user-login-form" class="user-login-form" method="POST" action="{{ url_for('auth.user_login') }}">
    <div class="user-login-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" required>
    </div>

    <div class="user-login-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" required>
    </div>

    <div class="user-login-actions">
      <button type="submit" class="user-btn-login">Login</button>
    </div>
  </form>
</section>

{% endblock %}
