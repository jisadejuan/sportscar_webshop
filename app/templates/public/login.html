{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">Login Page</h1>

<div class="login-container">
  <!-- User Login Box -->
  <div class="login-box">
    <h2>Log in as User</h2>
    <form method="POST" action="{{ url_for('auth.user_login') }}">
      <label for="user-email">Gmail Address</label>
      <input type="email" id="user-email" name="email" placeholder="example@gmail.com" required>

      <label for="user-password">Password</label>
      <input type="password" id="user-password" name="password" placeholder="Enter your password" required>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="{{ url_for('auth.user_signup') }}">Sign Up</a></p>
    </div>
  </div>

  <!-- Admin Login Box -->
  <div class="login-box">
    <h2>Log in as Admin</h2>
    <!-- ✅ Siguraduhin na POST at tamang route -->
    <form method="POST" action="{{ url_for('admin.admin_login') }}">
      <label for="admin-email">Gmail Address</label>
      <input type="email" id="admin-email" name="email" placeholder="admin@gmail.com" required>

      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" name="password" placeholder="Enter your password" required>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="{{ url_for('admin.admin_signup') }}">Sign Up</a></p>
    </div>
  </div>
</div>
{% endblock %}
