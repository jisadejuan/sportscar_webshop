{% extends 'base.html' %}
{% block content %}

<section id="admin-dashboard-section" class="admin-dashboard-container">
  <h1 class="admin-dashboard-title">Admin Dashboard</h1>

  <div id="admin-actions-bar" class="admin-actions-container">
    <a href="{{ url_for('admin.create_product') }}" class="admin-btn-add">+ Add New Product</a>
  </div>

  <table id="admin-products-table" class="admin-table">
    <thead>
      <tr>
        <th class="admin-th">Name</th>
        <th class="admin-th">Category</th>
        <th class="admin-th">Price</th>
        <th class="admin-th">Stock</th>
        <th class="admin-th">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for product in products %}
      <tr class="admin-row">
        <td class="admin-td">{{ product.name }}</td>
        <td class="admin-td">{{ product.category }}</td>
        <td class="admin-td">{{ product.price }}</td>
        <td class="admin-td">{{ product.stock }}</td>
        <td class="admin-td">
          <a href="{{ url_for('admin.edit_product', product_id=product.id) }}" class="admin-btn-edit">Edit</a>
          <a href="{{ url_for('admin.delete_product', product_id=product.id) }}" class="admin-btn-delete">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>

{% endblock %}
