{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">Admin Sign Upppppppp</h1>

<div class="signup-box">
  <form method="POST" action="{{ url_for('admin.admin_signup') }}">
    <label for="admin-email">Gmail Address</label>
    <input type="email" id="admin-email" name="email" placeholder="admin@gmail.com" required>

    <label for="admin-password">Password</label>
    <input type="password" id="admin-password" name="password" placeholder="Enter your password" required>

    <button type="submit" class="btn-signup">Sign Up</button>
  </form>

  <div class="signup-footer">
    <p>Already have an account? <a href="{{ url_for('admin.admin_login') }}">Log In</a></p>
  </div>
</div>
{% endblock %}
