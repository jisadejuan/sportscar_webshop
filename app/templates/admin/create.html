{% extends 'base.html' %}
{% block content %}

<section id="admin-create-section" class="admin-create-container">
  <h1 class="admin-create-title">Add New Product</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="admin-create-messages">
        {% for category, message in messages %}
          <p class="admin-create-message admin-create-{{ category }}"><strong>{{ message }}</strong></p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form id="admin-create-form" class="admin-create-form" method="POST" action="{{ url_for('admin.create_product') }}">
    <div class="admin-create-group">
      <label for="create-name">Name</label>
      <input type="text" id="create-name" name="name" required>
    </div>

    <div class="admin-create-group">
      <label for="create-category">Category</label>
      <input type="text" id="create-category" name="category" required>
    </div>

    <div class="admin-create-group">
      <label for="create-price">Price</label>
      <input type="number" id="create-price" name="price" step="0.01" required>
    </div>

    <div class="admin-create-group">
      <label for="create-stock">Stock</label>
      <input type="number" id="create-stock" name="stock" required>
    </div>

    <div class="admin-create-group">
      <label for="create-description">Description</label>
      <textarea id="create-description" name="description"></textarea>
    </div>

    <div class="admin-create-group">
      <label for="create-image">Image URL</label>
      <input type="url" id="create-image" name="image">
    </div>

    <div class="admin-create-actions">
      <button type="submit" class="admin-btn-save">Save Product</button>
      <a href="{{ url_for('admin.dashboard') }}" class="admin-btn-cancel">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
