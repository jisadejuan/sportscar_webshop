{% extends 'base.html' %}
{% block content %}

<section id="admin-create-page" class="admin-create-page">
  <div class="admin-create-container">
    <h1 class="admin-create-title">Add New Product</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="admin-create-messages">
          {% for category, message in messages %}
            <p class="admin-create-message admin-create-{{ category }}"><strong>{{ message }}</strong></p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form class="admin-create-form" method="POST" action="{{ url_for('product.create_product') }}">
      <!-- fields -->
      <div class="admin-create-group">
        <label for="create-name">Name:</label>
        <input type="text" id="create-name" name="name" required>
      </div>
      <!-- repeat for other inputs -->

      <div class="admin-create-actions">
        <button type="submit" class="admin-btn-save">Save Product</button>
        <a href="{{ url_for('product.product_list') }}" class="admin-btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
