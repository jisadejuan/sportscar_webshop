{% extends 'base.html' %}
{% block content %}

<section id="edit-product-section" class="edit-product-container">
  <h1 class="edit-product-title">Edit Product</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="edit-product-messages">
        {% for category, message in messages %}
          <p class="edit-product-message edit-product-{{ category }}"><strong>{{ message }}</strong></p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form id="edit-product-form" class="edit-product-form" method="POST" action="{{ url_for('product.edit_product', product_id=product.id) }}">
    <div class="edit-product-group">
      <label for="edit-name">Name</label>
      <input type="text" id="edit-name" name="name" value="{{ product.name }}" required>
    </div>

    <div class="edit-product-group">
      <label for="edit-category">Category</label>
      <input type="text" id="edit-category" name="category" value="{{ product.category }}" required>
    </div>

    <div class="edit-product-group">
      <label for="edit-price">Price</label>
      <input type="number" id="edit-price" name="price" step="0.01" value="{{ product.price }}" required>
    </div>

    <div class="edit-product-group">
      <label for="edit-stock">Stock</label>
      <input type="number" id="edit-stock" name="stock" value="{{ product.stock }}" required>
    </div>

    <div class="edit-product-group">
      <label for="edit-description">Description</label>
      <textarea id="edit-description" name="description">{{ product.description }}</textarea>
    </div>

    <div class="edit-product-group">
      <label for="edit-image">Image Filename</label>
      <input type="text" id="edit-image" name="image" value="{{ product.image }}">
    </div>

    <div class="edit-product-preview">
      <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="{{ product.name }}">
    </div>

    <div class="edit-product-actions">
      <button type="submit" class="edit-btn-save">Save Changes</button>
      <a href="{{ url_for('product.admin_dashboard') }}" class="edit-btn-cancel">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
