<body>
  <h1>Edit Product</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <p class="{{ category }}"><strong>{{ message }}</strong></p>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('product.edit_product', product_id=product.id) }}">
    <label>Name:</label><br>
    <input type="text" name="name" value="{{ product.name }}" required><br><br>

    <label>Category:</label><br>
    <input type="text" name="category" value="{{ product.category }}" required><br><br>

    <label>Price:</label><br>
    <input type="number" step="0.01" name="price" value="{{ product.price }}" required><br><br>

    <label>Stock:</label><br>
    <input type="number" name="stock" value="{{ product.stock }}" required><br><br>

    <label>Description:</label><br>
    <textarea name="description">{{ product.description }}</textarea><br><br>

    <label>Image Filename:</label><br>
    <input type="text" name="image" value="{{ product.image }}"><br><br>

    <img src="{{ url_for('static', filename='images/' ~ product.image) }}" 
         alt="{{ product.name }}" style="max-width:200px; margin-top:10px;"><br><br>

    <button type="submit">Save Changes</button>
    <a href="{{ url_for('product.admin_dashboard') }}">Cancel</a>
  </form>
</body>
