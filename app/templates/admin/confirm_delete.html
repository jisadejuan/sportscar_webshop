<body>
  <h1>Delete Product</h1>

  <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
  <p>Category: {{ product.category }}</p>
  <p>Price: {{ product.price }}</p>
  <p>Stock: {{ product.stock }}</p>
  <p>This action cannot be undone.</p>

  <!-- Confirmation form — POST triggers the actual delete -->
  <form method="POST" action="{{ url_for('product.delete_product', product_id=product.id) }}">
    <button type="submit">Yes, Delete</button>
  </form>

  <!-- Cancel — goes back to list without deleting -->
  <a href="{{ url_for('product.product_list') }}">Cancel</a>
</body>
