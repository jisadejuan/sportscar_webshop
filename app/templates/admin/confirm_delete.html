{% extends 'base.html' %}
{% block content %}

<section id="delete-product-section" class="delete-product-container">
  <h1 class="delete-product-title">Delete Product</h1>

  <div class="delete-product-details">
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
    <p>Category: {{ product.category }}</p>
    <p>Price: {{ product.price }}</p>
    <p>Stock: {{ product.stock }}</p>
    <p class="delete-warning">This action cannot be undone.</p>

    <div class="delete-product-preview">
      <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="{{ product.name }}">
    </div>
  </div>

  <!-- FIXED: use admin.delete_product -->
  <form id="delete-product-form" class="delete-product-form" method="POST" action="{{ url_for('admin.delete_product', product_id=product.id) }}">
    <div class="delete-product-actions">
      <button type="submit" class="delete-btn-confirm">Yes, Delete</button>
      <!-- FIXED: use admin.admin_dashboard -->
      <a href="{{ url_for('admin.admin_dashboard') }}" class="delete-btn-cancel">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
